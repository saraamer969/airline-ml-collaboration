
name: Full-stack CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt pytest

      - name: Run backend structure tests
        run: python -m pytest -q backend/tests/test_structure.py

  frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: airline-frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: airline-frontend/package-lock.json

      - name: Install Angular dependencies
        run: npm ci

      - name: Build Angular frontend
        run: npm run build
